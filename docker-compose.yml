services:

  mysql:
    image: mysql:8.0
    container_name: ctcl-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ctcl_2026
      MYSQL_DATABASE: ctcl_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  ctcl-web:
    build: .

    container_name: ctcl-web

    depends_on:
      - mysql

    env_file:
      - .env

    ports:
      - "8000:8000"

volumes:
  mysql_data:
