{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">

    Dashboard

</h2>

<div class="row g-4">

    <div class="col-md-3">

        <div class="card border-primary shadow-sm">

            <div class="card-body text-center">

                <i class="bi bi-database fs-1 text-primary"></i>

                <h6 class="mt-3">

                    Total Records

                </h6>

                <h3>{{ summary.total_records }}</h3>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card border-success shadow-sm">

            <div class="card-body text-center">

                <i class="bi bi-check-circle fs-1 text-success"></i>

                <h6 class="mt-3">

                    Active Records

                </h6>

                <h3>{{ summary.active_records }}</h3>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card border-warning shadow-sm">

            <div class="card-body text-center">

                <i class="bi bi-people fs-1 text-warning"></i>

                <h6 class="mt-3">

                    Total Users

                </h6>

                <h3>{{ summary.total_users }}</h3>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card border-danger shadow-sm">

            <div class="card-body text-center">

                <i class="bi bi-arrow-repeat fs-1 text-danger"></i>

                <h6 class="mt-3">

                    Today's Revisions

                </h6>

                <h3>{{ summary.today_revisions }}</h3>

            </div>

        </div>

    </div>

</div>

{% endblock %}
