{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h3 class="mb-4">

        Reports

    </h3>

    <div class="row">

        {% for report in reports %}

        <div class="col-md-4 mb-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">

                        {{ report.title }}

                    </h5>

                    <p class="text-muted">

                        {{ report.description }}

                    </p>

                </div>

                <div class="card-footer bg-white border-0">

                    <a
                        href="{{ report.url }}"
                        class="btn btn-primary w-100">

                        Export Report

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
