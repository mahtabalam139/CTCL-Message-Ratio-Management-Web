<div class="card shadow-sm">

    <div class="card-header bg-warning">

        <h5 class="mb-0">

            Edit User Preview

        </h5>

    </div>

    <div class="card-body">

        <table class="table table-bordered">

            <tr>

                <th width="30%">

                    Username

                </th>

                <td>

                    {{ user["username"] }}

                </td>

            </tr>

            <tr>

                <th>

                    Full Name

                </th>

                <td>

                    {{ user["full_name"] }}

                </td>

            </tr>

            <tr>

                <th>

                    Role

                </th>

                <td>

                    {{ user["role"] }}

                </td>

            </tr>

            <tr>

                <th>

                    Status

                </th>

                <td>

                    {% if user["is_active"] == 1 %}

                        Active

                    {% else %}

                        Disabled

                    {% endif %}

                </td>

            </tr>

        </table>

        <div class="text-end">

            <a
                href="/edit-user/{{ user['username'] }}"
                class="btn btn-secondary">

                Back

            </a>

            <form
                method="post"
                action="/confirm-edit-user"
                style="display:inline;">

                <input
                    type="hidden"
                    name="username"
                    value="{{ user['username'] }}">

                <input
                    type="hidden"
                    name="full_name"
                    value="{{ user['full_name'] }}">

                <input
                    type="hidden"
                    name="role"
                    value="{{ user['role'] }}">

                <input
                    type="hidden"
                    name="is_active"
                    value="{{ user['is_active'] }}">

                <button
                    type="submit"
                    class="btn btn-success">

                    Confirm Update

                </button>

            </form>

        </div>

    </div>

</div>
