<div class="card shadow-sm">

    <div class="card-header bg-warning">

        <h5 class="mb-0">

            Reset Password

        </h5>

    </div>

    <div class="card-body">

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}

        {% if show_preview %}

        <div class="alert alert-warning">

            <strong>Confirmation Required!</strong>

            <br><br>

            Password will be reset for the following user.

        </div>

        <table class="table table-bordered">

            <tr>

                <th width="35%">Username</th>

                <td>{{ user["username"] }}</td>

            </tr>

            <tr>

                <th>Full Name</th>

                <td>{{ user["full_name"] }}</td>

            </tr>

            <tr>

                <th>Role</th>

                <td>{{ user["role"] }}</td>

            </tr>

        </table>

        <div class="text-end">

            <a
                href="/reset-password/{{ user['username'] }}"
                class="btn btn-secondary">

                Back

            </a>

            <form
                method="post"
                action="/confirm-reset-password"
                style="display:inline;">

                <input
                    type="hidden"
                    name="username"
                    value="{{ user['username'] }}">

                <button
                    type="submit"
                    class="btn btn-warning">

                    Confirm Reset Password

                </button>

            </form>

        </div>

        {% else %}

        <form
            method="post"
            action="/reset-password/{{ user['username'] }}">

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ user['username'] }}"
                    readonly>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    New Password

                </label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Confirm Password

                </label>

                <input
                    type="password"
                    class="form-control"
                    name="confirm_password"
                    required>

            </div>

            <div class="text-end">

                <a
                    href="/users"
                    class="btn btn-secondary">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="btn btn-warning">

                    Preview

                </button>

            </div>

        </form>

        {% endif %}

    </div>

</div>
