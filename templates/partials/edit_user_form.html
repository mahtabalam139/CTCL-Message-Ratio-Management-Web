<div class="card shadow-sm">

    <div class="card-header bg-warning">

        <h5 class="mb-0">

            Edit User

        </h5>

    </div>

    <div class="card-body">

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}

        <form
            method="post"
            action="/edit-user/{{ user['username'] }}">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Username

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        value="{{ user['username'] }}"
                        readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="full_name"
                        value="{{ user['full_name'] }}"
                        required>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Role

                    </label>

                    <select
                        class="form-select"
                        name="role">

                        <option
                            value="Admin"
                            {% if user["role"]=="Admin" %}selected{% endif %}>

                            Admin

                        </option>

                        <option
                            value="User"
                            {% if user["role"]=="User" %}selected{% endif %}>

                            User

                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        class="form-select"
                        name="is_active">

                        <option
                            value="1"
                            {% if user["is_active"]==1 %}selected{% endif %}>

                            Active

                        </option>

                        <option
                            value="0"
                            {% if user["is_active"]==0 %}selected{% endif %}>

                            Disabled

                        </option>

                    </select>

                </div>

            </div>

            <div class="text-end">

                <a
                    href="/users"
                    class="btn btn-secondary">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="btn btn-warning">

                    Preview

                </button>

            </div>

        </form>

    </div>

</div>
